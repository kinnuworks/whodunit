<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500&family=Courier+Prime:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#F3EDDF;color:#201B15;overflow:hidden}
.card{position:relative;box-sizing:border-box;width:1200px;height:630px;padding:64px 72px}
.label{margin:0;font:700 22px/1.45 'Courier Prime',monospace;letter-spacing:.1em;text-transform:uppercase;color:#6B6156}
h1{margin:34px 0 0;max-width:900px;font:400 84px/1.06 'Young Serif',Georgia,serif;letter-spacing:-.01em}
.rule{position:absolute;left:72px;right:72px;bottom:150px;border-top:3px solid #201B15}
.line{position:absolute;left:72px;bottom:70px;margin:0;font:400 26px/1.45 'Courier Prime',monospace;color:#6B6156}
.line b{color:#B4261F}
.stamp{position:absolute;right:66px;bottom:104px;transform:rotate(-6deg);padding:16px 30px 10px;border:7px double #B4261F;background:#F3EDDF;color:#B4261F;font:700 46px/1 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase}
</style></head><body><div class="card">
<p class="label">Whodunit case file</p>
<h1>57 commits since it last worked. Which one did it?</h1>
<div class="rule"></div>
<p class="line">Suspects: 57. Cleared: 56. <b>x</b> <b>x</b> o o <b>x</b></p>
<p class="stamp">Case closed</p>
</div></body></html>
