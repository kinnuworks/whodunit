[project]
name = "whodunit"
version = "0.1.0"
description = "Finds the commit that broke an AI agent, and says what that commit was asked to do."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
whodunit = "whodunit.cli:main"

[project.optional-dependencies]
trace = [
    "neatlogs>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whodunit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real refund agent in worktrees, needs uv and neatroots, and takes a few minutes"]
